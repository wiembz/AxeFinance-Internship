<div class="auth-container">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="card">
    <h2>Superadmin signup</h2>
    <mat-form-field appearance="outline" class="full">
      <mat-label>Username</mat-label>
      <input matInput formControlName="username" required />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" type="email" required />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full">
      <mat-label>Password</mat-label>
      <input matInput formControlName="password" type="password" required />
    </mat-form-field>
    <button mat-raised-button color="primary" class="full" [disabled]="form.invalid || loading">
      {{ loading ? 'Creating…' : 'Create Superadmin' }}
    </button>
    <a routerLink="/login" class="link">Back to login</a>
  </form>
</div>
