<!--Modern login layout with image on right-->

<div class="login-container">
  <!-- Decorative floating shapes -->
  <div class="floating-shape shape-1"></div>
  <div class="floating-shape shape-2"></div>
  <div class="floating-shape shape-3"></div>

  <div class="login-content">
    <!-- Left side - Login form -->
    <div class="login-card">
      <div class="login-brand">
        <div class="login-logo">
          <i class="login-logo-icon">PS</i>
        </div>
        <h2>ProblemStack</h2>
        <p class="login-subtitle">Sign in to your account to continue</p>
      </div>

      <div *ngIf="error" class="error-message">
        {{ error }}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <input
              type="email"
              id="email"
              formControlName="email"
              placeholder="Enter your email"
              [ngClass]="{
                invalid:
                  loginForm.get('email')?.invalid &&
                  loginForm.get('email')?.touched
              }"
            />
          </div>
          <div
            class="validation-error"
            *ngIf="
              loginForm.get('email')?.invalid && loginForm.get('email')?.touched
            "
          >
            <span *ngIf="loginForm.get('email')?.errors?.['required']"
              >Email is required</span
            >
            <span *ngIf="loginForm.get('email')?.errors?.['email']"
              >Please enter a valid email</span
            >
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              formControlName="password"
              placeholder="Enter your password"
              [ngClass]="{
                invalid:
                  loginForm.get('password')?.invalid &&
                  loginForm.get('password')?.touched
              }"
            />
          </div>
          <div
            class="validation-error"
            *ngIf="
              loginForm.get('password')?.invalid &&
              loginForm.get('password')?.touched
            "
          >
            <span *ngIf="loginForm.get('password')?.errors?.['required']"
              >Password is required</span
            >
            <span *ngIf="loginForm.get('password')?.errors?.['minlength']"
              >Password must be at least 6 characters</span
            >
          </div>
        </div>

        <button type="submit" [disabled]="loginForm.invalid || isLoading">
          <span *ngIf="!isLoading"> Sign In </span>
          <span *ngIf="isLoading" class="loading-spinner-container">
            <span class="loading-spinner"></span>
            Signing In...
          </span>
        </button>

        <div class="register-link" *ngIf="showCreateAccount">
          Don't have an account yet?
          <a routerLink="/superadmin-signup">Create Account</a>
        </div>
      </form>
    </div>

    <!-- Right side - Image -->
    <div class="login-image-container">
      <img
        src="/assets/images/login-image3.png"
        alt="ProblemStack Login"
        class="login-image"
      />
    </div>
  </div>
</div>
