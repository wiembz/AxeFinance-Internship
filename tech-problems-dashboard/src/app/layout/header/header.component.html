<header class="app-header" 
        [class.sidebar-collapsed]="sidebarService.isCollapsed"
        role="banner">
  
  <!-- Left Section: Brand and Breadcrumb -->
  <div class="header-left">
    <!-- Mobile Menu Toggle -->
    <button 
      type="button"
      class="mobile-menu-toggle"
      (click)="sidebarService.toggle()"
      [attr.aria-label]="sidebarService.isCollapsed ? 'Open menu' : 'Close menu'"
      aria-controls="sidebar-navigation">
      <svg class="menu-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
      </svg>
    </button>
    
    <!-- Brand -->
    <div class="brand">
      <h1 class="brand-text">
        <span class="brand-primary">Problem</span><span class="brand-accent">Stack</span>
      </h1>
      <div class="brand-tagline">Tech Dashboard</div>
    </div>
  </div>
  
  <!-- Center Section: Search -->
  <div class="header-center">
    <div class="search-container">
      <div class="search-wrapper">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input 
          type="search" 
          placeholder="Search problems, projects, departments..." 
          class="search-input"
          [(ngModel)]="searchQuery"
          (input)="onSearch($event)"
          (keyup.enter)="onSearchSubmit()"
          [attr.aria-label]="'Search across dashboard'"
          autocomplete="off"
          role="searchbox"
        />
        <button 
          type="button"
          class="search-clear"
          *ngIf="searchQuery"
          (click)="clearSearch()"
          aria-label="Clear search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
  
  <!-- Right Section: User Actions -->
  <div class="header-right">
    <!-- Theme Toggle -->
    <app-theme-toggle [compact]="true" class="theme-toggle-wrapper"></app-theme-toggle>
    
    <!-- Notifications -->
    <button 
      type="button"
      class="notification-btn"
      [attr.aria-label]="'Notifications' + (notificationCount > 0 ? ' (' + notificationCount + ' unread)' : '')"
      title="Notifications">
      <svg class="notification-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
      </svg>
      <span class="notification-badge" *ngIf="notificationCount > 0">{{ notificationCount > 99 ? '99+' : notificationCount }}</span>
    </button>

    <!-- User Section -->
    <div class="user-section" *ngIf="auth.currentUser as user; else guest">
      <!-- User Avatar and Info -->
      <div class="user-info">
        <div class="user-avatar">
          <span class="avatar-text">{{ getInitials(user.username) }}</span>
        </div>
        <div class="user-details">
          <span class="username">{{ user.username }}</span>
          <span class="user-role">{{ user.role || 'User' }}</span>
        </div>
      </div>
      
      <!-- Actions Dropdown -->
      <div class="user-actions">
        <button 
          type="button" 
          class="user-menu-toggle"
          (click)="toggleUserMenu()"
          [attr.aria-expanded]="showUserMenu"
          aria-haspopup="true"
          [attr.aria-label]="'User menu for ' + user.username">
          <svg class="menu-arrow" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
          </svg>
        </button>
        
        <!-- Dropdown Menu -->
        <div class="user-dropdown" *ngIf="showUserMenu" [@fadeInOut]>
          <div class="dropdown-content" role="menu">
            <a href="#" class="dropdown-item" role="menuitem">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
              </svg>
              Profile
            </a>
            <a href="#" class="dropdown-item" role="menuitem">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.82,11.69,4.82,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
              </svg>
              Settings
            </a>
            <div class="dropdown-divider"></div>
            <button type="button" class="dropdown-item logout-item" (click)="logout()" role="menuitem">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.59L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
              </svg>
              Logout
            </button>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Guest Actions -->
    <ng-template #guest>
      <div class="guest-actions">
        <a routerLink="/login" class="login-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"/>
          </svg>
          Sign In
        </a>
      </div>
    </ng-template>
  </div>
</header>
